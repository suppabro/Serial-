<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Music Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #09090b; /* Deep Dark Space Color */
            color: #f4f4f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Premium Neon Card */
        .player-card {
            background: #18181b;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 35px 25px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                        0 0 40px rgba(29, 185, 84, 0.1); /* Soft Green Glow */
            transition: transform 0.3s ease;
        }

        .player-card:hover {
            transform: translateY(-5px);
        }

        /* Vinyl Album Art */
        .cover-art-container {
            width: 210px;
            height: 210px;
            margin: 0 auto 30px auto;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(135deg, #1db954, #1ed760);
            box-shadow: 0 15px 35px rgba(29, 185, 84, 0.25);
            position: relative;
        }

        .cover-art {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #18181b;
            animation: spin 10s linear infinite;
            animation-play-state: paused;
        }

        /* Vinyl Record Center Hole */
        .cover-art-container::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 38px;
            height: 38px;
            background: #18181b;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .song-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #ffffff;
            letter-spacing: -0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist-name {
            font-size: 13px;
            font-weight: 400;
            color: #a1a1aa;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Modern Controls Layout */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-bottom: 35px;
        }

        .control-btn {
            background: #27272a;
            border: none;
            color: #e4e4e7;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover { 
            background: #3f3f46; 
            color: #fff;
            transform: scale(1.05); 
        }
        
        .control-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

        .play-btn {
            background: #1db954;
            color: #000;
            width: 64px;
            height: 64px;
            font-size: 22px;
            box-shadow: 0 8px 20px rgba(29, 185, 84, 0.3);
        }
        
        .play-btn:hover { 
            background: #1ed760; 
            transform: scale(1.08);
            box-shadow: 0 10px 25px rgba(29, 185, 84, 0.5);
        }

        /* Premium Sleek Search Bar */
        .search-container {
            display: flex;
            background: #27272a;
            border-radius: 16px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            transition: all 0.3s ease;
        }

        .search-container:focus-within {
            border-color: #1db954;
            box-shadow: 0 0 12px rgba(29, 185, 84, 0.2);
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            outline: none;
        }

        input[type="text"]::placeholder { color: #71717a; }

        .search-btn {
            background: #1db954;
            color: #000;
            border: none;
            padding: 0 22px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s ease;
        }

        .search-btn:hover { background: #1ed760; }

        #yt-player-container {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 10px;
            height: 10px;
            opacity: 0;
            pointer-events: none;
        }

        footer {
            margin-top: 35px;
            font-size: 10px;
            font-weight: 500;
            color: #52525b;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="cover-art-container">
            <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=500&auto=format&fit=crop" id="artwork" class="cover-art" alt="Cover Art">
        </div>

        <div class="song-title" id="song-title">Smart Player</div>
        <div class="artist-name" id="artist-name">Awaiting search</div>

        <div class="controls">
            <button class="control-btn play-btn" id="play-pause-btn" onclick="togglePlay()" disabled>▶</button>
            <button class="control-btn" id="next-btn" onclick="playNextTrack()" disabled>⏭</button>
        </div>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="සින්දුවක් සර්ච් කරන්න...">
            <button class="search-btn" id="search-btn" onclick="startSearch()">සොයන්න</button>
        </div>
    </div>
    
    <div id="yt-player-container">
        <div id="youtube-player"></div>
    </div>

    <footer>Developed by Supun Dilshan</footer>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const songTitle = document.getElementById('song-title');
        const artistName = document.getElementById('artist-name');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const nextBtn = document.getElementById('next-btn');
        const artwork = document.getElementById('artwork');

        let upcomingTracks = [];
        let isPlaying = false;
        
        // Vercel එකයි, Backup විදියට Piped එකයි
        const VERCEL_API = "https://ytmusicapi-ruby.vercel.app";
        const FALLBACK_APIS = [
            "https://pipedapi.tokhmi.xyz", 
            "https://pipedapi.kavin.rocks",
            "https://api.piped.projectsegfau.lt"
        ];
        
        let ytPlayer;
        let isPlayerReady = false;

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtube-player', {
                height: '10', width: '10',
                playerVars: { 'autoplay': 1, 'controls': 0, 'showinfo': 0 },
                events: {
                    'onReady': () => { isPlayerReady = true; },
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                artwork.style.animationPlayState = 'running';
                playPauseBtn.innerText = '⏸';
                isPlaying = true;
            } else if (event.data === YT.PlayerState.PAUSED) {
                artwork.style.animationPlayState = 'paused';
                playPauseBtn.innerText = '▶';
                isPlaying = false;
            } else if (event.data === YT.PlayerState.ENDED) {
                playNextTrack();
            }
        }

        function onPlayerError(event) {
            artistName.innerText = "Error loading. Skipping...";
            setTimeout(playNextTrack, 2000);
        }

        function togglePlay() {
            if (!isPlayerReady) return;
            if (isPlaying) { ytPlayer.pauseVideo(); } 
            else { ytPlayer.playVideo(); }
        }

        // කෙලින්ම ලින්ක් එකක් දැම්මොත් ඒකෙන් ID එක ගන්න ෆන්ක්ෂන් එක
        function extractVideoID(query) {
            if(query.includes('v=')) return query.split('v=')[1].split('&')[0];
            if(query.includes('youtu.be/')) return query.split('youtu.be/')[1].split('?')[0];
            return null;
        }

        async function fetchSongData(query) {
            // මුලින්ම බලනවා දුන්නේ ලින්ක් එකක්ද කියලා
            const extractedID = extractVideoID(query);
            if (extractedID) {
                return { videoId: extractedID, title: "Custom Song", related: [] };
            }

            // ලින්ක් එකක් නෙවෙයි නම්, Vercel එකෙන් සර්ච් කරනවා
            try {
                const res = await fetch(`${VERCEL_API}/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (!data.error && data.videoId) {
                    return { videoId: data.videoId, title: data.title, related: data.related || [] };
                }
            } catch (error) { console.log("Vercel Search Failed, trying fallback..."); }

            // Vercel එක හිර වුණොත් Backup වලින් ට්‍රයි කරනවා
            for (let api of FALLBACK_APIS) {
                try {
                    const res = await fetch(`${api}/search?q=${encodeURIComponent(query)}&filter=music_songs`);
                    const data = await res.json();
                    if (data.items && data.items.length > 0) {
                        const vidId = data.items[0].url.split('v=')[1];
                        return { videoId: vidId, title: data.items[0].title, related: [] };
                    }
                } catch (e) { console.log(`${api} failed.`); }
            }
            throw new Error("All servers are down");
        }

        async function startSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            if (!isPlayerReady) {
                songTitle.innerText = "Connecting Player...";
                artistName.innerText = "Please wait a second...";
                return;
            }

            songTitle.innerText = "සොයමින් පවතී...";
            artistName.innerText = "කරුණාකර රැඳී සිටින්න...";
            searchBtn.disabled = true;
            artwork.style.animationPlayState = 'paused';

            try {
                const songData = await fetchSongData(query);
                upcomingTracks = songData.related;
                playVideo(songData.videoId, songData.title);
            } catch (error) {
                songTitle.innerText = "Search Failed";
                artistName.innerText = "Servers are busy. Try again.";
            }
            searchBtn.disabled = false;
        }

                function playVideo(videoId, title) {
            const thumbnailUrl = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
            artwork.src = thumbnailUrl;
            
            const shortTitle = title.length > 30 ? title.substring(0, 30) + "..." : title;
            songTitle.innerText = shortTitle;
            artistName.innerText = "Now Playing 🎵";
            
            playPauseBtn.disabled = false;
            nextBtn.disabled = false;
            
            ytPlayer.loadVideoById(videoId);

            // Background Play UI (Notification Bar)
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: shortTitle,
                    artist: "Premium Music Player",
                    artwork: [{ src: thumbnailUrl, sizes: "512x512", type: "image/jpeg" }]
                });
                navigator.mediaSession.setActionHandler('nexttrack', playNextTrack);
                navigator.mediaSession.setActionHandler('play', togglePlay);
                navigator.mediaSession.setActionHandler('pause', togglePlay);
            }
        }

        function playNextTrack() {
            if (upcomingTracks.length > 0) {
                artistName.innerText = "Loading next song...";
                artwork.style.animationPlayState = 'paused';
                const randomIndex = Math.floor(Math.random() * upcomingTracks.length);
                const nextTrack = upcomingTracks.splice(randomIndex, 1)[0]; 
                playVideo(nextTrack.id, nextTrack.title);
            } else {
                songTitle.innerText = "Queue Ended";
                artistName.innerText = "Search another song";
                ytPlayer.stopVideo();
                artwork.style.animationPlayState = 'paused';
            }
        }

        searchInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") { e.preventDefault(); startSearch(); }
        });
    </script>

    </body>
</html>
