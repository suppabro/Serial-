<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Smart Music Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px;
        }
        .player-container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 450px;
            margin: 0 auto;
        }
        h2 { margin-bottom: 5px; color: #1db954; }
        #track-info { margin-bottom: 20px; font-size: 14px; color: #b3b3b3; min-height: 20px; }
        
        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            padding: 10px;
            border-radius: 25px;
            border: none;
            outline: none;
            width: 60%;
            font-size: 14px;
            text-align: center;
            background: #2a2a2a;
            color: white;
        }
        button {
            background-color: #1db954;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        button:hover { background-color: #1ed760; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        
        #next-btn { margin-top: 15px; display: none; }
        
        /* YouTube Player එක හංගනවා (සද්දෙ විතරක් එන්න) */
        #yt-player-container {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 0;
            height: 0;
            visibility: hidden;
        }

        footer { margin-top: 40px; font-size: 12px; color: #666; }
    </style>
</head>
<body>

    <div class="player-container">
        <h2>🎵 Smart Stream Player</h2>
        
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search a song or artist...">
            <button id="search-btn" onclick="startSearch()">Search & Play</button>
        </div>

        <p id="track-info">Waiting for your search...</p>
        
        <button id="next-btn" onclick="playNextTrack()">⏭ Skip to Next Similar Song</button>
    </div>
    
    <div id="yt-player-container">
        <div id="youtube-player"></div>
    </div>

    <footer>Developed by Supun Dilshan</footer>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const trackInfo = document.getElementById('track-info');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const nextBtn = document.getElementById('next-btn');

        let upcomingTracks = [];
        const API_BASE = "https://ytmusicapi-ruby.vercel.app";
        
        let ytPlayer;
        let isPlayerReady = false;

        // YouTube API එක ලෝඩ් වුණාම Player එක හදනවා
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtube-player', {
                height: '100',
                width: '100',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'showinfo': 0,
                    'rel': 0
                },
                events: {
                    'onReady': () => { isPlayerReady = true; },
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        // සින්දුවක් ඉවර වුණාම ඊළඟ එක Play කරන්න
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                playNextTrack();
            }
        }

        // Error එකක් ආවොත් ඊළඟ එකට පනින්න
        function onPlayerError(event) {
            console.error("YouTube Player Error:", event.data);
            trackInfo.innerText = "Error loading track. Skipping to next...";
            setTimeout(playNextTrack, 2000);
        }

        async function startSearch() {
            if (!isPlayerReady) return alert("Player is still loading, please wait a second...");

            const query = searchInput.value.trim();
            if (!query) return alert("Please enter a song name!");

            trackInfo.innerText = "Searching our custom server...";
            searchBtn.disabled = true;

            try {
                // ඔයාගේ Vercel එකෙන් සින්දුව හොයනවා
                const response = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                if (data.error) throw new Error(data.error);

                upcomingTracks = data.related || [];
                playVideo(data.videoId, data.title);

            } catch (error) {
                trackInfo.innerText = "Error finding song. Please try again.";
                console.error(error);
            }
            searchBtn.disabled = false;
        }

        function playVideo(videoId, title) {
            trackInfo.innerText = "Playing: " + title;
            nextBtn.style.display = "inline-block";
            nextBtn.disabled = false;
            
            // කෙලින්ම YouTube එකෙන් Play කරනවා
            ytPlayer.loadVideoById(videoId);
        }

        function playNextTrack() {
            if (upcomingTracks.length > 0) {
                const nextTrack = upcomingTracks.shift(); 
                playVideo(nextTrack.id, nextTrack.title);
            } else {
                trackInfo.innerText = "End of similar tracks. Please search again.";
                ytPlayer.stopVideo();
                nextBtn.style.display = "none";
            }
        }

        searchInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                startSearch();
            }
        });
    </script>

</body>
</html>
