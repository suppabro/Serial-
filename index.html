<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Music Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>   
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #000000; /* PURE BLACK FOR AMOLED */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* AMOLED Neon Card */
        .player-card {
            background: #000000;
            border: 1px solid rgba(29, 185, 84, 0.3); /* Subtle Green Border */
            border-radius: 24px;
            padding: 35px 25px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 35px rgba(29, 185, 84, 0.15); /* Soft Green Glow */
            transition: transform 0.3s ease;
        }

        .player-card:hover { transform: translateY(-5px); }

        /* Vinyl Album Art */
        .cover-art-container {
            width: 210px;
            height: 210px;
            margin: 0 auto 30px auto;
            border-radius: 50%;
            padding: 4px;
            background: #1db954; /* Pure Neon Green Ring */
            box-shadow: 0 0 30px rgba(29, 185, 84, 0.4);
            position: relative;
        }

        .cover-art {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid #000000; /* Pitch black border */
            animation: spin 10s linear infinite;
            animation-play-state: paused;
        }

        /* Vinyl Record Center Hole */
        .cover-art-container::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 38px;
            height: 38px;
            background: #000000;
            border-radius: 50%;
            border: 2px solid #1db954;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .song-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist-name {
            font-size: 13px;
            color: #1db954; /* Green text for artist */
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* Modern Controls */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-bottom: 35px;
        }

        .control-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover { 
            background: rgba(29, 185, 84, 0.1); 
            border-color: #1db954;
            color: #1db954;
            transform: scale(1.1); 
        }

        .control-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: rgba(255,255,255,0.1); color: #fff; }

        .play-btn {
            background: #1db954;
            color: #000000;
            border: none;
            width: 65px;
            height: 65px;
            font-size: 22px;
            box-shadow: 0 0 20px rgba(29, 185, 84, 0.4);
        }
        
        .play-btn:hover { 
            background: #1ed760; 
            transform: scale(1.1);
            box-shadow: 0 0 35px rgba(29, 185, 84, 0.7);
            border: none;
            color: #000000;
        }

        /* Pure Black Search Bar */
        .search-container {
            display: flex;
            background: #000000;
            border-radius: 20px;
            padding: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

/* Pure Black Search Container - Vertical Stack */
        .search-container {
            width: 100%;
            margin-top: 10px;
        }

        input[type="text"] {
            width: 100%;
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 14px 16px;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 12px; /* බාර් එක සහ බටන් එක අතර පරතරය */
            text-align: center; /* ටයිප් කරන අකුරු මැදට එන්න */
        }

        input[type="text"]:focus {
            border-color: #1db954;
            box-shadow: 0 0 20px rgba(29, 185, 84, 0.25);
        }

        input[type="text"]::placeholder { color: #555555; }

        .search-btn {
            width: 100%;
            background: transparent;
            color: #1db954;
            border: 1px solid #1db954;
            padding: 12px 0;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .search-btn:hover { 
            background: #1db954; 
            color: #000000;
            box-shadow: 0 0 20px rgba(29, 185, 84, 0.4);
        }

        #yt-player-container {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 10px;
            height: 10px;
            opacity: 0;
            pointer-events: none;
        }

        footer {
            margin-top: 35px;
            font-size: 10px;
            font-weight: 500;
            color: #555555;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

    </style>
</head>
<body>

    <div class="player-card">
        <div class="cover-art-container">
            <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=500&auto=format&fit=crop" id="artwork" class="cover-art" alt="Cover Art">
        </div>

        <div class="song-title" id="song-title">Smart Player</div>
        <div class="artist-name" id="artist-name">Awaiting search...</div>

        <div class="controls">
            <button class="control-btn play-btn" id="play-pause-btn" onclick="togglePlay()" disabled>▶</button>
            <button class="control-btn" id="next-btn" onclick="playNextTrack()" disabled>⏭</button>
        </div>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search song...">
            <button class="search-btn" id="search-btn" onclick="startSearch()">Search</button>
        </div>
    </div>
    
    <div id="yt-player-container">
        <div id="youtube-player"></div>
    </div>

    <footer>Developed by Supun Dilshan</footer>
<script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const songTitle = document.getElementById('song-title');
        const artistName = document.getElementById('artist-name');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const nextBtn = document.getElementById('next-btn');
        const artwork = document.getElementById('artwork');

        let upcomingTracks = [];
        let isPlaying = false;
        
        // Vercel එකයි, Backup විදියට Piped එකයි දෙකම තියෙනවා.
        const VERCEL_API = "https://ytmusicapi-ruby.vercel.app";
        const FALLBACK_APIS = [
            "https://pipedapi.tokhmi.xyz", 
            "https://pipedapi.kavin.rocks",
            "https://api.piped.projectsegfau.lt"
        ];
        
        let ytPlayer;
        let isPlayerReady = false;

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtube-player', {
                height: '10', width: '10',
                playerVars: { 'autoplay': 1, 'controls': 0, 'showinfo': 0 },
                events: {
                    'onReady': () => { isPlayerReady = true; },
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                artwork.style.animationPlayState = 'running';
                playPauseBtn.innerText = '⏸';
                isPlaying = true;
            } else if (event.data === YT.PlayerState.PAUSED) {
                artwork.style.animationPlayState = 'paused';
                playPauseBtn.innerText = '▶';
                isPlaying = false;
            } else if (event.data === YT.PlayerState.ENDED) {
                playNextTrack();
            }
        }

        function onPlayerError(event) {
            artistName.innerText = "Error loading. Skipping...";
            setTimeout(playNextTrack, 2000);
        }

        function togglePlay() {
            if (!isPlayerReady) return;
            if (isPlaying) { ytPlayer.pauseVideo(); } 
            else { ytPlayer.playVideo(); }
        }

        async function fetchSongData(query) {
            try {
                const res = await fetch(`${VERCEL_API}/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (!data.error && data.videoId) {
                    return { videoId: data.videoId, title: data.title, related: data.related || [] };
                }
            } catch (error) { console.log("Vercel Search Failed, trying fallback..."); }

            for (let api of FALLBACK_APIS) {
                try {
                    const res = await fetch(`${api}/search?q=${encodeURIComponent(query)}&filter=music_songs`);
                    const data = await res.json();
                    if (data.items && data.items.length > 0) {
                        const vidId = data.items[0].url.split('v=')[1];
                        return { videoId: vidId, title: data.items[0].title, related: [] };
                    }
                } catch (e) { console.log(`${api} failed.`); }
            }
            throw new Error("All servers are down");
        }

        async function startSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            // YouTube Player එක ලෝඩ් වෙලා නැත්තම් මෙතනින් කියයි
            if (!isPlayerReady) {
                songTitle.innerText = "Connecting Player...";
                artistName.innerText = "Please wait 2 seconds & click Search again.";
                return;
            }

            songTitle.innerText = "Searching...";
            artistName.innerText = "Please wait...";
            searchBtn.disabled = true;
            artwork.style.animationPlayState = 'paused';

            try {
                const songData = await fetchSongData(query);
                upcomingTracks = songData.related;
                playVideo(songData.videoId, songData.title);
            } catch (error) {
                songTitle.innerText = "Search Failed";
                artistName.innerText = "Servers are busy. Try again.";
            }
            searchBtn.disabled = false;
        }

        function playVideo(videoId, title) {
            const thumbnailUrl = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
            artwork.src = thumbnailUrl;
            
            const shortTitle = title.length > 30 ? title.substring(0, 30) + "..." : title;
            songTitle.innerText = shortTitle;
            artistName.innerText = "Now Playing 🎵";
            
            playPauseBtn.disabled = false;
            nextBtn.disabled = false;
            
            ytPlayer.loadVideoById(videoId);

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: shortTitle,
                    artist: "Smart Stream Player",
                    artwork: [{ src: thumbnailUrl, sizes: "512x512", type: "image/jpeg" }]
                });
                navigator.mediaSession.setActionHandler('nexttrack', playNextTrack);
                navigator.mediaSession.setActionHandler('play', togglePlay);
                navigator.mediaSession.setActionHandler('pause', togglePlay);
            }
        }

        function playNextTrack() {
            if (upcomingTracks.length > 0) {
                artistName.innerText = "Loading next song...";
                artwork.style.animationPlayState = 'paused';
                const randomIndex = Math.floor(Math.random() * upcomingTracks.length);
                const nextTrack = upcomingTracks.splice(randomIndex, 1)[0]; 
                playVideo(nextTrack.id, nextTrack.title);
            } else {
                songTitle.innerText = "Queue Ended";
                artistName.innerText = "Search another song";
                ytPlayer.stopVideo();
                artwork.style.animationPlayState = 'paused';
            }
        }

        searchInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") { e.preventDefault(); startSearch(); }
        });
    </script>

    </body>
</html>
