<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Live Radio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .player-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Live Badge */
        .live-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ff3b30;
            color: white;
            padding: 3px 10px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 10px;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
            display: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .cover-art-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 25px auto;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(45deg, #1db954, #1ed760);
            box-shadow: 0 10px 30px rgba(29, 185, 84, 0.3);
            position: relative;
        }

        .cover-art {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #121212;
            animation: spin 8s linear infinite;
            animation-play-state: paused;
        }

        .cover-art-container::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: #121212;
            border-radius: 50%;
            border: 2px solid #2c5364;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .song-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .artist-name {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 25px;
            min-height: 21px;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.1); }
        .control-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .play-btn {
            background: #1db954;
            width: 65px;
            height: 65px;
            font-size: 25px;
            box-shadow: 0 5px 15px rgba(29, 185, 84, 0.4);
        }
        .play-btn:hover { background: #1ed760; }

        /* Radio Mode Buttons */
        .radio-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .radio-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
        }

        .radio-btn.active-host { background: #ff9500; border-color: #ff9500; color: #000; }
        .radio-btn.active-listen { background: #1db954; border-color: #1db954; color: #000; }

        .search-container {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 25px;
            padding: 5px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 15px;
            color: white;
            font-family: 'Poppins', sans-serif;
            outline: none;
        }

        .search-btn {
            background: #1db954;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .search-btn:hover { background: #1ed760; }

        #yt-player-container {
    position: absolute;
    top: -9999px;
    left: -9999px;
    width: 10px;
    height: 10px;
    opacity: 0;
    pointer-events: none;
}


        footer {
            margin-top: 30px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="live-badge" id="live-badge">LIVE</div>
        
        <div class="cover-art-container">
            <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=500&auto=format&fit=crop" id="artwork" class="cover-art" alt="Cover Art">
        </div>

        <div class="song-title" id="song-title">Smart Radio</div>
        <div class="artist-name" id="artist-name">Awaiting search...</div>

        <div class="controls">
            <button class="control-btn play-btn" id="play-pause-btn" onclick="togglePlay()" disabled>▶</button>
            <button class="control-btn" id="next-btn" onclick="playNextTrack()" disabled>⏭</button>
        </div>

        <div class="radio-controls">
            <button class="radio-btn" id="btn-broadcast" onclick="toggleBroadcast()">🎙️ Broadcast</button>
            <button class="radio-btn" id="btn-listen" onclick="toggleListen()">📻 Listen Live</button>
        </div>

        <div class="search-container" id="search-section">
            <input type="text" id="search-input" placeholder="Search song...">
            <button class="search-btn" id="search-btn" onclick="startSearch()">Search</button>
        </div>
    </div>
    
    <div id="yt-player-container">
        <div id="youtube
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const songTitle = document.getElementById('song-title');
        const artistName = document.getElementById('artist-name');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const nextBtn = document.getElementById('next-btn');
        const artwork = document.getElementById('artwork');
        const btnBroadcast = document.getElementById('btn-broadcast');
        const btnListen = document.getElementById('btn-listen');
        const searchSection = document.getElementById('search-section');
        const liveBadge = document.getElementById('live-badge');

        let upcomingTracks = [];
        let isPlaying = false;
        let currentVideoId = null;
        
        // Radio State Variables
        let isBroadcasting = false;
        let isListening = false;
        let syncInterval = null;
        
        // APIs
        const VERCEL_API = "https://ytmusicapi-ruby.vercel.app";
        const FIREBASE_DB = "https://ytmusic-7c501-default-rtdb.firebaseio.com/live.json";
        const FALLBACK_APIS = [
            "https://pipedapi.tokhmi.xyz", 
            "https://pipedapi.kavin.rocks",
            "https://api.piped.projectsegfau.lt"
        ];
        
        let ytPlayer;
        let isPlayerReady = false;

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtube-player', {
                height: '10', width: '10',
                playerVars: { 'autoplay': 1, 'controls': 0, 'showinfo': 0 },
                events: {
                    'onReady': () => { isPlayerReady = true; },
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                artwork.style.animationPlayState = 'running';
                playPauseBtn.innerText = '⏸';
                isPlaying = true;
            } else if (event.data === YT.PlayerState.PAUSED) {
                artwork.style.animationPlayState = 'paused';
                playPauseBtn.innerText = '▶';
                isPlaying = false;
            } else if (event.data === YT.PlayerState.ENDED) {
                if (isListening) {
                    artistName.innerText = "Waiting for host to play next...";
                } else {
                    playNextTrack();
                }
            }
        }

        function onPlayerError(event) {
            if(!isListening) { setTimeout(playNextTrack, 2000); }
        }

        function togglePlay() {
            if (!isPlayerReady) return;
            if (isPlaying) { ytPlayer.pauseVideo(); } 
            else { ytPlayer.playVideo(); }
        }

        // --- Radio Logic ---

        function toggleBroadcast() {
            if (isListening) toggleListen(); // Turn off listening if on
            isBroadcasting = !isBroadcasting;
            
            if (isBroadcasting) {
                btnBroadcast.classList.add('active-host');
                btnBroadcast.innerText = "🔴 Broadcasting";
                liveBadge.style.display = "block";
                liveBadge.innerText = "HOSTING";
                alert("You are now the Host! Songs you play will sync to everyone.");
                // Update currently playing song to DB
                if (currentVideoId) { updateFirebase(currentVideoId, songTitle.innerText); }
            } else {
                btnBroadcast.classList.remove('active-host');
                btnBroadcast.innerText = "🎙️ Broadcast";
                liveBadge.style.display = "none";
            }
        }

        function toggleListen() {
            if (isBroadcasting) toggleBroadcast(); // Turn off host if on
            isListening = !isListening;

            if (isListening) {
                btnListen.classList.add('active-listen');
                btnListen.innerText = "🎧 Listening Live";
                searchSection.style.display = "none"; // Hide search for listeners
                nextBtn.style.display = "none";
                liveBadge.style.display = "block";
                liveBadge.innerText = "LIVE SYNC";
                
                // Start polling Firebase every 4 seconds
                syncInterval = setInterval(syncFromFirebase, 4000);
                syncFromFirebase(); // Initial sync
            } else {
                btnListen.classList.remove('active-listen');
                btnListen.innerText = "📻 Listen Live";
                searchSection.style.display = "flex";
                nextBtn.style.display = "inline-block";
                liveBadge.style.display = "none";
                clearInterval(syncInterval);
            }
        }

        async function updateFirebase(videoId, title) {
            if (!isBroadcasting) return;
            try {
                await fetch(FIREBASE_DB, {
                    method: 'PUT',
                    body: JSON.stringify({
                        videoId: videoId,
                        title: title,
                        startTime: Date.now()
                    })
                });
            } catch (e) { console.error("Firebase update failed", e); }
        }

        async function syncFromFirebase() {
            try {
                const res = await fetch(FIREBASE_DB);
                const data = await res.json();
                
                if (data && data.videoId && data.videoId !== currentVideoId) {
                    // New song detected! Calculate how many seconds have passed
                    const elapsedSeconds = (Date.now() - data.startTime) / 1000;
                    playVideo(data.videoId, data.title, elapsedSeconds);
                }
            } catch (e) { console.error("Sync failed", e); }
        }

        // --- End Radio Logic ---

        async function fetchSongData(query) {
            try {
                const res = await fetch(`${VERCEL_API}/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (!data.error && data.videoId) {
                    return { videoId: data.videoId, title: data.title, related: data.related || [] };
                }
            } catch (error) { console.log("Vercel Search Failed, trying fallback..."); }

            for (let api of FALLBACK_APIS) {
                try {
                    const res = await fetch(`${api}/search?q=${encodeURIComponent(query)}&filter=music_songs`);
                    const data = await res.json();
                    if (data.items && data.items.length > 0) {
                        const vidId = data.items[0].url.split('v=')[1];
                        return { videoId: vidId, title: data.items[0].title, related: [] };
                    }
                } catch (e) { console.log(`${api} failed.`); }
            }
            throw new Error("All servers are down");
        }

        async function startSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            if (!isPlayerReady) {
                songTitle.innerText = "Connecting Player...";
                artistName.innerText = "Please wait 2 seconds & click Search again.";
                return;
            }

            songTitle.innerText = "Searching...";
            artistName.innerText = "Please wait...";
            searchBtn.disabled = true;
            artwork.style.animationPlayState = 'paused';

            try {
                const songData = await fetchSongData(query);
                upcomingTracks = songData.related;
                playVideo(songData.videoId, songData.title);
            } catch (error) {
                songTitle.innerText = "Search Failed";
                artistName.innerText = "Servers are busy. Try again.";
            }
            searchBtn.disabled = false;
        }

        function playVideo(videoId, title, startSeconds = 0) {
            currentVideoId = videoId;
            const thumbnailUrl = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
            artwork.src = thumbnailUrl;
            
            const shortTitle = title.length > 30 ? title.substring(0, 30) + "..." : title;
            songTitle.innerText = shortTitle;
            artistName.innerText = isListening ? "Live Radio 🎵" : "Now Playing 🎵";
            
            playPauseBtn.disabled = false;
            nextBtn.disabled = false;
            
            // Load video at specific time (for sync)
            ytPlayer.loadVideoById({videoId: videoId, startSeconds: startSeconds});

            // If broadcasting, tell Firebase the new song started NOW
            if (isBroadcasting && startSeconds === 0) {
                updateFirebase(videoId, shortTitle);
            }

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: shortTitle,
                    artist: isListening ? "Smart Live Radio" : "Smart Stream Player",
                    artwork: [{ src: thumbnailUrl, sizes: "512x512", type: "image/jpeg" }]
                });
                navigator.mediaSession.setActionHandler('nexttrack', () => { if(!isListening) playNextTrack(); });
                navigator.mediaSession.setActionHandler('play', togglePlay);
                navigator.mediaSession.setActionHandler('pause', togglePlay);
            }
        }

        function playNextTrack() {
            if (upcomingTracks.length > 0) {
                artistName.innerText = "Loading next song...";
                artwork.style.animationPlayState = 'paused';
                const randomIndex = Math.floor(Math.random() * upcomingTracks.length);
                const nextTrack = upcomingTracks.splice(randomIndex, 1)[0]; 
                playVideo(nextTrack.id, nextTrack.title);
            } else {
                songTitle.innerText = "Queue Ended";
                artistName.innerText = "Search another song";
                ytPlayer.stopVideo();
                artwork.style.animationPlayState = 'paused';
            }
        }

        searchInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") { e.preventDefault(); startSearch(); }
        });
    </script>
</body>
</html>
