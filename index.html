<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Smart Music Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px;
        }
        .player-container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 450px;
            margin: 0 auto;
        }
        h2 { margin-bottom: 5px; color: #1db954; }
        #track-info { margin-bottom: 20px; font-size: 14px; color: #b3b3b3; min-height: 20px; }
        
        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            padding: 10px;
            border-radius: 25px;
            border: none;
            outline: none;
            width: 60%;
            font-size: 14px;
            text-align: center;
            background: #2a2a2a;
            color: white;
        }
        button {
            background-color: #1db954;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        button:hover { background-color: #1ed760; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        
        #next-btn { margin-top: 10px; display: none; }
        audio { width: 100%; margin-top: 20px; outline: none; display: none; }
        footer { margin-top: 40px; font-size: 12px; color: #666; }
    </style>
</head>
<body>

    <div class="player-container">
        <h2>🎵 Smart Stream Player</h2>
        
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search a song or artist...">
            <button id="search-btn" onclick="startSearch()">Search & Play</button>
        </div>

        <p id="track-info">Waiting for your search...</p>
        
        <audio id="audio-player" controls></audio>
        <button id="next-btn" onclick="playNextTrack()">⏭ Skip to Next Similar Song</button>
    </div>

    <footer>Developed by Supun Dilshan</footer>

    <script>
        const audioPlayer = document.getElementById('audio-player');
        const trackInfo = document.getElementById('track-info');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const nextBtn = document.getElementById('next-btn');

        let upcomingTracks = [];

        // API Servers ලැයිස්තුව (එකක් ඩවුන් වුනොත් අනිත් එකට යයි)
        const apiInstances = [
            "https://pipedapi.kavin.rocks",
            "https://pipedapi.tokhmi.xyz",
            "https://api.piped.projectsegfau.lt",
            "https://piped-api.garudalinux.org",
            "https://piped-api.lunar.icu",
            "https://pipedapi.smarthome-nj.de"
        ];

        // වැඩ කරන Server එක හොයාගෙන Data ගන්නා විශේෂ Function එක
        async function fetchWithFallback(endpoint) {
            for (let instance of apiInstances) {
                try {
                    const response = await fetch(`${instance}${endpoint}`);
                    if (response.ok) {
                        return await response.json();
                    }
                } catch (error) {
                    console.log(`Server down: ${instance}. Trying next...`);
                }
            }
            throw new Error("All API servers are down.");
        }

        async function startSearch() {
            const query = searchInput.value.trim();
            if (!query) return alert("Please enter a song name!");

            trackInfo.innerText = "Connecting to available servers...";
            searchBtn.disabled = true;

            try {
                // Auto-Fallback එක හරහා Search කිරීම
                const searchData = await fetchWithFallback(`/search?q=${encodeURIComponent(query)}&filter=music_songs`);
                
                if (!searchData || !searchData.items || searchData.items.length === 0) throw new Error("No results found.");

                const firstResult = searchData.items[0];
                const videoId = firstResult.url.split('/watch?v=')[1];
                
                await playVideo(videoId, firstResult.title);

            } catch (error) {
                trackInfo.innerText = "All servers are busy. Please try again later.";
                console.error(error);
            }
            searchBtn.disabled = false;
        }

        async function playVideo(videoId, title) {
            trackInfo.innerText = "Extracting Audio from active server...";
            nextBtn.disabled = true;

            try {
                // Auto-Fallback එක හරහා Stream Data ගැනීම
                const streamData = await fetchWithFallback(`/streams/${videoId}`);

                const audioStreams = streamData.audioStreams;
                const bestAudio = audioStreams.find(stream => stream.mimeType.includes('audio/mp4')) || audioStreams[0];

                if (streamData.relatedStreams) {
                    upcomingTracks = streamData.relatedStreams
                        .filter(stream => stream.type === 'stream' && !stream.isShort)
                        .map(stream => ({
                            id: stream.url.split('/watch?v=')[1],
                            title: stream.title
                        }));
                }

                trackInfo.innerText = "Playing: " + title;
                audioPlayer.src = bestAudio.url;
                audioPlayer.style.display = "block";
                nextBtn.style.display = "inline-block";
                
                await audioPlayer.play();
                nextBtn.disabled = false;

            } catch (error) {
                console.error("Playback error:", error);
                trackInfo.innerText = "Error loading audio. Skipping to next...";
                setTimeout(playNextTrack, 3000);
            }
        }

        function playNextTrack() {
            if (upcomingTracks.length > 0) {
                const nextTrack = upcomingTracks.shift(); 
                playVideo(nextTrack.id, nextTrack.title);
            } else {
                trackInfo.innerText = "End of similar tracks. Please search again.";
                audioPlayer.style.display = "none";
                nextBtn.style.display = "none";
            }
        }

        audioPlayer.addEventListener('ended', playNextTrack);
        audioPlayer.addEventListener('error', playNextTrack);

        searchInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                startSearch();
            }
        });
    </script>

</body>
</html>
